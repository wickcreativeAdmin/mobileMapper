<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Mobile Mapper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      touch-action: none;
      background: #000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #root {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    /* Mobile layout */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      background: #111827;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    .app-wrapper {
      display: contents;
    }
    .side-panel {
      display: none;
    }
    /* Desktop layout */
    @media (min-width: 900px) {
      .app-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .side-panel {
        display: flex;
        flex-direction: column;
        width: 280px;
        min-width: 280px;
        max-width: 280px;
        background: #1f2937;
        border-right: 1px solid #374151;
        overflow-y: auto;
        flex-shrink: 0;
      }
      .side-panel-right {
        border-right: none;
        border-left: 1px solid #374151;
      }
      .app-container {
        width: 430px;
        min-width: 430px;
        max-width: 430px;
        flex-shrink: 0;
        border-left: 1px solid #374151;
        border-right: 1px solid #374151;
      }
      .mobile-only {
        display: none !important;
      }
      .desktop-only {
        display: flex !important;
      }
    }
    @media (max-width: 899px) {
      .desktop-only {
        display: none !important;
      }
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .shortcut-key {
      display: inline-block;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
      min-width: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;
    
    const API_URL = '';
    
    const RESOLUTION = 192;
    const HALF_BEAT = RESOLUTION / 2;
    const AUTOSAVE_KEY = 'mobilemapper_autosave_v3';
    const AUTOSAVE_INTERVAL = 5000;
    
    // Note flags for pro mode
    const NoteFlags = { NONE: 0, TAP: 1, FORCED: 2 };
    
    // Instruments configuration
    const INSTRUMENTS = {
      Single: { name: 'Guitar', lanes: 5, colors: ['#22c55e', '#ef4444', '#eab308', '#3b82f6', '#f97316'], labels: ['G', 'R', 'Y', 'B', 'O'], hasSustain: true, hasOpen: true },
      DoubleBass: { name: 'Bass', lanes: 5, colors: ['#22c55e', '#ef4444', '#eab308', '#3b82f6', '#f97316'], labels: ['G', 'R', 'Y', 'B', 'O'], hasSustain: true, hasOpen: true },
      Drums: { name: 'Drums', lanes: 5, colors: ['#f97316', '#ef4444', '#eab308', '#3b82f6', '#22c55e'], labels: ['K', 'R', 'Y', 'B', 'G'], hasSustain: false, hasOpen: false },
    };
    const DIFFICULTIES = ['Easy', 'Medium', 'Hard', 'Expert'];
    const OPEN_LANE = 7;
    
    function ChartMaker() {
      // App state
      const [screen, setScreen] = useState('upload');
      
      // Audio state
      const [audioFile, setAudioFile] = useState(null);
      const [audioFileName, setAudioFileName] = useState('');
      const [audioUrl, setAudioUrl] = useState(null);
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [audioReady, setAudioReady] = useState(false);
      const [waveformData, setWaveformData] = useState(null);
      
      // Analysis state
      const [analysisError, setAnalysisError] = useState(null);
      const [analysisProgress, setAnalysisProgress] = useState('');
      
      // Chart state
      const [tempoMap, setTempoMap] = useState([{ tick: 0, bpm: 120 }]);
      const [tempoMapType, setTempoMapType] = useState('beat');
      const [allTempoMaps, setAllTempoMaps] = useState(null);
      const [firstBeat, setFirstBeat] = useState(0);
      const [gridSnap, setGridSnap] = useState(HALF_BEAT);
      
      // Multi-chart state
      const [charts, setCharts] = useState({});
      const [currentInstrument, setCurrentInstrument] = useState('Single');
      const [currentDifficulty, setCurrentDifficulty] = useState('Expert');
      
      // Metadata state
      const [songName, setSongName] = useState('Untitled');
      const [artistName, setArtistName] = useState('Unknown');
      const [album, setAlbum] = useState('');
      const [year, setYear] = useState('');
      const [genre, setGenre] = useState('rock');
      const [charter, setCharter] = useState('');
      const [previewStart, setPreviewStart] = useState(0);
      const [previewEnd, setPreviewEnd] = useState(0);
      
      // Pro mode state
      const [proMode, setProMode] = useState(false);
      const [tapMode, setTapMode] = useState(false);
      const [forceMode, setForceMode] = useState(false);
      
      // Note clap state
      const [noteClap, setNoteClap] = useState('off');
      const [lastClappedTick, setLastClappedTick] = useState(-1);
      const clapAudioRef = useRef(null);
      
      // Selection/Copy state
      const [selectionStart, setSelectionStart] = useState(null);
      const [selectionEnd, setSelectionEnd] = useState(null);
      const [clipboard, setClipboard] = useState([]);
      const [showEditMenu, setShowEditMenu] = useState(false);
      const [isSelectingStart, setIsSelectingStart] = useState(false);
      
      // Sustain mode state - array of active lanes
      const [sustainModes, setSustainModes] = useState([]);
      
      // Save/Load state
      const [showMenu, setShowMenu] = useState(false);
      const [showMetaEditor, setShowMetaEditor] = useState(false);
      const [showAddChart, setShowAddChart] = useState(false);
      const [showLyrics, setShowLyrics] = useState(false);
      const [lastSaved, setLastSaved] = useState(null);
      const [hasAutoSave, setHasAutoSave] = useState(false);
      const [pendingLoadData, setPendingLoadData] = useState(null);
      
      // Lyrics state
      const [lyrics, setLyrics] = useState([]);  // Array of {time, text}
      const [lyricsSearching, setLyricsSearching] = useState(false);
      const [lyricsOffset, setLyricsOffset] = useState(0);  // Offset in seconds
      const [lyricsError, setLyricsError] = useState(null);
      
      // Touch state
      const [touchStart, setTouchStart] = useState(null);
      const [reverseScroll, setReverseScroll] = useState(false);
      
      // Refs
      const audioRef = useRef(null);
      const animationRef = useRef(null);
      const canvasRef = useRef(null);
      
      // Current chart key and notes accessor
      const currentChartKey = `${currentDifficulty}${currentInstrument}`;
      const notes = charts[currentChartKey] || [];
      const setNotes = useCallback((newNotes) => {
        setCharts(prev => ({
          ...prev,
          [currentChartKey]: typeof newNotes === 'function' ? newNotes(prev[currentChartKey] || []) : newNotes
        }));
      }, [currentChartKey]);
      
      // Current instrument config
      const instrumentConfig = INSTRUMENTS[currentInstrument];
      
      // Initialize clap audio context
      useEffect(() => {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        clapAudioRef.current = audioCtx;
        return () => audioCtx.close();
      }, []);
      
      // Play clap sound
      const playClap = useCallback(() => {
        if (noteClap === 'off' || !clapAudioRef.current) return;
        try {
          const ctx = clapAudioRef.current;
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const volumes = { low: 0.1, medium: 0.3, high: 0.6 };
          gain.gain.setValueAtTime(volumes[noteClap] || 0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(900, ctx.currentTime);
          osc.type = 'square';
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) { console.error('Clap error:', e); }
      }, [noteClap]);
      
      // Keyboard shortcuts (desktop)
      useEffect(() => {
        if (screen !== 'chart') return;
        
        const handleKeyDown = (e) => {
          // Don't trigger if typing in an input, textarea, or select
          const tag = e.target.tagName.toUpperCase();
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          // Also check for contenteditable
          if (e.target.isContentEditable) return;
          
          const key = e.key.toLowerCase();
          
          // Note placement: 1-5 or G-R-Y-B-O
          const noteKeys = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, 'g': 0, 'r': 1, 'y': 2, 'b': 3, 'o': 4 };
          if (noteKeys.hasOwnProperty(key)) {
            e.preventDefault();
            if (e.shiftKey) {
              toggleSustainMode(noteKeys[key]);
            } else {
              toggleNoteAtCurrent(noteKeys[key]);
            }
            return;
          }
          
          // Open note (guitar/bass only)
          if (key === '0' || key === '`') {
            e.preventDefault();
            if (instrumentConfig.hasOpen) {
              if (e.shiftKey) {
                toggleSustainMode(0, true);
              } else {
                toggleOpenNote();
              }
            }
            return;
          }
          
          // Playback
          if (key === ' ') {
            e.preventDefault();
            togglePlay();
            return;
          }
          
          // Navigation
          if (key === 'arrowup' || key === 'w') {
            e.preventDefault();
            moveByGrid(e.shiftKey ? 4 : 1);
            return;
          }
          if (key === 'arrowdown' || key === 's') {
            e.preventDefault();
            moveByGrid(e.shiftKey ? -4 : -1);
            return;
          }
          if (key === 'arrowleft' || key === 'a') {
            e.preventDefault();
            moveByBeats(-1);
            return;
          }
          if (key === 'arrowright' || key === 'd') {
            e.preventDefault();
            moveByBeats(1);
            return;
          }
          
          // Pro mode toggles
          if (key === 't') {
            e.preventDefault();
            setTapMode(!tapMode);
            return;
          }
          if (key === 'f') {
            e.preventDefault();
            setForceMode(!forceMode);
            return;
          }
          
          // Grid snap
          if (key === 'q') {
            e.preventDefault();
            setGridSnap(RESOLUTION);
            return;
          }
          if (key === 'e') {
            e.preventDefault();
            setGridSnap(HALF_BEAT);
            return;
          }
          
          // Undo placeholder - could implement undo stack later
          if (e.ctrlKey && key === 'z') {
            e.preventDefault();
            // TODO: implement undo
            return;
          }
          
          // Copy/Paste
          if (e.ctrlKey && key === 'c') {
            e.preventDefault();
            copySelection();
            return;
          }
          if (e.ctrlKey && key === 'v') {
            e.preventDefault();
            pasteAtCurrent();
            return;
          }
        };
        
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [screen, toggleNoteAtCurrent, toggleSustainMode, toggleOpenNote, togglePlay, 
          moveByGrid, moveByBeats, tapMode, forceMode, instrumentConfig, copySelection, pasteAtCurrent]);
      
      // Generate waveform from audio - higher resolution for highway display
      const generateWaveform = async (file) => {
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await file.arrayBuffer();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          
          const rawData = audioBuffer.getChannelData(0);
          const sampleRate = audioBuffer.sampleRate;
          const audioDuration = audioBuffer.duration;
          
          // Generate waveform data at ~100 samples per second for smooth scrolling
          const samplesPerSecond = 100;
          const totalSamples = Math.floor(audioDuration * samplesPerSecond);
          const blockSize = Math.floor(rawData.length / totalSamples);
          const waveform = [];
          
          for (let i = 0; i < totalSamples; i++) {
            let sum = 0;
            const startIdx = i * blockSize;
            for (let j = 0; j < blockSize && (startIdx + j) < rawData.length; j++) {
              sum += Math.abs(rawData[startIdx + j]);
            }
            waveform.push({
              time: i / samplesPerSecond,
              value: sum / blockSize
            });
          }
          
          // Normalize
          const max = Math.max(...waveform.map(w => w.value));
          const normalized = waveform.map(w => ({
            time: w.time,
            value: max > 0 ? w.value / max : 0
          }));
          
          setWaveformData(normalized);
          audioContext.close();
        } catch (err) {
          console.error('Waveform generation failed:', err);
        }
      };
      
      // Get visible waveform samples for the current view
      const getVisibleWaveform = useCallback(() => {
        if (!waveformData || waveformData.length === 0) return [];
        
        // Calculate time range visible on highway
        const centerTime = currentTime;
        const bpm = getCurrentBpm();
        const secondsPerBeat = 60 / bpm;
        const secondsVisible = beatsVisible * secondsPerBeat;
        const startTime = centerTime - secondsVisible / 2;
        const endTime = centerTime + secondsVisible / 2;
        
        // Filter waveform samples in visible range
        return waveformData.filter(w => w.time >= startTime && w.time <= endTime);
      }, [waveformData, currentTime, beatsVisible]);
      
      // Check for auto-save on mount
      useEffect(() => {
        const saved = localStorage.getItem(AUTOSAVE_KEY);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data && data.songName && (data.notes || data.charts)) {
              setHasAutoSave(true);
              setPendingLoadData(data);
              setScreen('resume');
            }
          } catch (e) {
            console.error('Failed to parse autosave:', e);
            localStorage.removeItem(AUTOSAVE_KEY);
          }
        }
      }, []);
      
      // Auto-save effect
      useEffect(() => {
        if (screen !== 'chart') return;
        
        const saveData = () => {
          const data = {
            version: 4,
            savedAt: new Date().toISOString(),
            songName, artistName, album, year, genre, charter,
            previewStart, previewEnd,
            audioFileName, duration, currentTime, firstBeat,
            tempoMap, tempoMapType, allTempoMaps,
            charts, currentInstrument, currentDifficulty,
            playbackRate, gridSnap, reverseScroll, proMode, noteClap,
            lyrics, lyricsOffset
          };
          localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
          setLastSaved(new Date());
        };
        
        saveData();
        const interval = setInterval(saveData, AUTOSAVE_INTERVAL);
        return () => clearInterval(interval);
      }, [screen, songName, artistName, album, year, genre, charter, previewStart, previewEnd,
          audioFileName, duration, currentTime, firstBeat, tempoMap, tempoMapType, allTempoMaps,
          charts, currentInstrument, currentDifficulty, playbackRate, gridSnap, reverseScroll, proMode, noteClap,
          lyrics, lyricsOffset]);
      
      const clearAutoSave = () => {
        localStorage.removeItem(AUTOSAVE_KEY);
        setHasAutoSave(false);
      };
      
      const saveProgress = () => {
        const data = {
          version: 4,
          savedAt: new Date().toISOString(),
          songName, artistName, album, year, genre, charter,
          previewStart, previewEnd,
          audioFileName, duration, currentTime, firstBeat,
          tempoMap, tempoMapType, allTempoMaps,
          charts, currentInstrument, currentDifficulty,
          playbackRate, gridSnap, reverseScroll, proMode, noteClap,
          lyrics, lyricsOffset
        };
        
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${songName}_progress.chartmaker`;
        a.click();
        URL.revokeObjectURL(url);
        setShowMenu(false);
      };
      
      const handleLoadProgress = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data && data.version && data.notes) {
              setPendingLoadData(data);
              setScreen('resume');
            } else {
              alert('Invalid save file');
            }
          } catch (err) {
            alert('Failed to read save file');
          }
        };
        reader.readAsText(file);
        setShowMenu(false);
      };
      
      const resumeFromData = (data) => {
        setSongName(data.songName || 'Untitled');
        setArtistName(data.artistName || 'Unknown');
        setAlbum(data.album || '');
        setYear(data.year || '');
        setGenre(data.genre || 'rock');
        setCharter(data.charter || '');
        setPreviewStart(data.previewStart || 0);
        setPreviewEnd(data.previewEnd || 0);
        setAudioFileName(data.audioFileName || '');
        setDuration(data.duration || 0);
        setCurrentTime(data.currentTime || 0);
        setFirstBeat(data.firstBeat || 0);
        setTempoMap(data.tempoMap || [{ tick: 0, bpm: 120 }]);
        setTempoMapType(data.tempoMapType || 'beat');
        setAllTempoMaps(data.allTempoMaps || null);
        // Handle v2 (notes) and v3 (charts) formats
        if (data.charts) {
          setCharts(data.charts);
        } else if (data.notes) {
          setCharts({ ExpertSingle: data.notes });
        } else {
          setCharts({ ExpertSingle: [] });
        }
        setCurrentInstrument(data.currentInstrument || 'Single');
        setCurrentDifficulty(data.currentDifficulty || 'Expert');
        setPlaybackRate(data.playbackRate || 1.0);
        setGridSnap(data.gridSnap || HALF_BEAT);
        setReverseScroll(data.reverseScroll || false);
        setProMode(data.proMode || false);
        setNoteClap(data.noteClap || 'off');
        setLyrics(data.lyrics || []);
        setLyricsOffset(data.lyricsOffset || 0);
        setPendingLoadData(null);
      };
      
      const handleResumeAudio = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !pendingLoadData) return;
        
        setAudioFile(file);
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        setAudioUrl(URL.createObjectURL(file));
        
        // Generate waveform
        generateWaveform(file);
        
        resumeFromData(pendingLoadData);
        setScreen('chart');
      };
      
      const startFresh = () => {
        clearAutoSave();
        setPendingLoadData(null);
        setScreen('upload');
      };
      
      const getCurrentBpm = useCallback(() => {
        const tick = timeToTick(currentTime);
        let bpm = tempoMap[0]?.bpm || 120;
        for (const entry of tempoMap) {
          if (entry.tick <= tick) bpm = entry.bpm;
          else break;
        }
        return bpm;
      }, [currentTime, tempoMap]);
      
      const timeToTick = useCallback((time) => {
        let tick = 0;
        let t = -firstBeat;
        let bpm = tempoMap[0]?.bpm || 120;
        let idx = 0;
        
        while (t < time && idx <= tempoMap.length) {
          const next = tempoMap[idx + 1];
          const tps = (bpm / 60) * RESOLUTION;
          
          if (next) {
            const nextTime = t + (next.tick - tick) / tps;
            if (nextTime <= time) {
              tick = next.tick;
              t = nextTime;
              bpm = next.bpm;
              idx++;
              continue;
            }
          }
          tick += (time - t) * tps;
          break;
        }
        return Math.round(tick);
      }, [tempoMap, firstBeat]);
      
      const tickToTime = useCallback((targetTick) => {
        let time = -firstBeat;
        let tick = 0;
        let bpm = tempoMap[0]?.bpm || 120;
        
        for (let i = 0; i < tempoMap.length; i++) {
          const entry = tempoMap[i];
          const next = tempoMap[i + 1];
          
          if (entry.tick > targetTick) break;
          
          if (entry.tick > tick) {
            const delta = entry.tick - tick;
            time += delta / ((bpm / 60) * RESOLUTION);
            tick = entry.tick;
          }
          bpm = entry.bpm;
          
          if (!next || next.tick > targetTick) {
            const remaining = targetTick - tick;
            time += remaining / ((bpm / 60) * RESOLUTION);
            break;
          }
        }
        return time;
      }, [tempoMap, firstBeat]);
      
      const currentTick = timeToTick(currentTime);
      const currentBpm = getCurrentBpm();
      const beatsVisible = 8;
      const ticksVisible = beatsVisible * RESOLUTION;
      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      
      const handleFileSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        setAudioFile(file);
        setAudioFileName(file.name);
        setSongName(file.name.replace(/\.[^/.]+$/, ""));
        
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        setAudioUrl(URL.createObjectURL(file));
        
        // Generate waveform
        generateWaveform(file);
        
        setScreen('analyzing');
        setAnalysisProgress('Uploading audio...');
        setAnalysisError(null);
        
        try {
          const formData = new FormData();
          formData.append('file', file);
          
          setAnalysisProgress('Analyzing tempo (this may take a moment)...');
          
          const response = await fetch(`${API_URL}/analyze`, {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (!data.success) throw new Error(data.error || 'Analysis failed');
          
          setAllTempoMaps(data.tempoMaps);
          setFirstBeat(data.firstBeat || 0);
          setDuration(data.duration);
          setTempoMap(data.tempoMaps.beat);
          setTempoMapType('beat');
          setCharts({ ExpertSingle: [] });
          setCurrentInstrument('Single');
          setCurrentDifficulty('Expert');
          setCurrentTime(0);
          
          setScreen('chart');
        } catch (err) {
          console.error('Analysis error:', err);
          setAnalysisError(err.message || 'Failed to analyze audio');
        }
        setAnalysisProgress('');
      };
      
      const handleTempoMapTypeChange = (type) => {
        if (allTempoMaps?.[type]) {
          setTempoMapType(type);
          setTempoMap(allTempoMaps[type]);
        }
      };
      
      const handleCanPlayThrough = () => {
        setAudioReady(true);
        if (audioRef.current) {
          audioRef.current.playbackRate = playbackRate;
        }
      };
      
      // Proper seeking function that works on mobile - snaps to grid
      const seekTo = (time, shouldSnap = true) => {
        if (!audioRef.current) return;
        let targetTime = Math.max(0, Math.min(duration, time));
        
        // Snap to grid if requested
        if (shouldSnap) {
          const targetTick = timeToTick(targetTime);
          const snappedTick = Math.round(targetTick / gridSnap) * gridSnap;
          targetTime = tickToTime(snappedTick);
          targetTime = Math.max(0, Math.min(duration, targetTime));
        }
        
        // Pause first, then seek, then update state
        const wasPlaying = isPlaying;
        if (wasPlaying) {
          audioRef.current.pause();
        }
        
        audioRef.current.currentTime = targetTime;
        setCurrentTime(targetTime);
        
        // Don't auto-resume - let user control playback
      };
      
      const updateTime = useCallback(() => {
        if (audioRef.current) {
          const newTime = audioRef.current.currentTime;
          setCurrentTime(newTime);
          
          // Note clap - play sound when crossing notes
          if (noteClap !== 'off') {
            const newTick = timeToTick(newTime);
            const notesToClap = notes.filter(n => n.tick > lastClappedTick && n.tick <= newTick);
            if (notesToClap.length > 0) {
              playClap();
              setLastClappedTick(Math.max(...notesToClap.map(n => n.tick)));
            }
          }
        }
        if (isPlaying) animationRef.current = requestAnimationFrame(updateTime);
      }, [isPlaying, noteClap, notes, lastClappedTick, timeToTick, playClap]);
      
      useEffect(() => {
        if (isPlaying) animationRef.current = requestAnimationFrame(updateTime);
        return () => { if (animationRef.current) cancelAnimationFrame(animationRef.current); };
      }, [isPlaying, updateTime]);
      
      const togglePlay = async () => {
        if (!audioRef.current || !audioReady) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          try {
            setLastClappedTick(timeToTick(currentTime) - 1);  // Reset clap tracker
            // Ensure we're at the right position before playing
            if (Math.abs(audioRef.current.currentTime - currentTime) > 0.1) {
              audioRef.current.currentTime = currentTime;
            }
            audioRef.current.playbackRate = playbackRate;
            if (clapAudioRef.current?.state === 'suspended') {
              await clapAudioRef.current.resume();
            }
            await audioRef.current.play();
            setIsPlaying(true);
          } catch (err) {
            console.error('Play failed:', err);
          }
        }
      };
      
      const handleRateChange = (rate) => {
        setPlaybackRate(rate);
        if (audioRef.current) audioRef.current.playbackRate = rate;
      };
      
      // Move by grid units (half-beats by default)
      const moveByGrid = (num) => {
        if (!audioRef.current || duration === 0) return;
        const target = Math.max(0, currentTick + (num * gridSnap));
        const newTime = Math.max(0, Math.min(duration, tickToTime(target)));
        seekTo(newTime);
      };
      
      const moveByBeats = (num) => {
        if (!audioRef.current || duration === 0) return;
        const target = Math.max(0, currentTick + (num * RESOLUTION));
        const newTime = Math.max(0, Math.min(duration, tickToTime(target)));
        seekTo(newTime);
      };
      
      const moveBySeconds = (sec) => {
        if (!audioRef.current || duration === 0) return;
        const newTime = Math.max(0, Math.min(duration, currentTime + sec));
        seekTo(newTime);
      };
      
      // Handle clicking on progress bar to seek
      const handleProgressBarClick = (e) => {
        if (!audioRef.current || duration === 0) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percent = clickX / rect.width;
        const newTime = percent * duration;
        seekTo(newTime, true);
      };
      
      // Calculate which regions of the song have notes (for progress bar visualization)
      const getNoteRegions = useCallback(() => {
        if (notes.length === 0 || duration === 0) return [];
        
        // Divide song into 50 segments
        const segments = 50;
        const segmentDuration = duration / segments;
        const regions = [];
        
        for (let i = 0; i < segments; i++) {
          const segStart = i * segmentDuration;
          const segEnd = (i + 1) * segmentDuration;
          const segStartTick = timeToTick(segStart);
          const segEndTick = timeToTick(segEnd);
          
          // Check if any notes fall within this segment
          const hasNotes = notes.some(n => {
            const noteEnd = n.tick + (n.duration || 0);
            return n.tick <= segEndTick && noteEnd >= segStartTick;
          });
          
          if (hasNotes) {
            regions.push({ start: (i / segments) * 100, width: (1 / segments) * 100 });
          }
        }
        
        return regions;
      }, [notes, duration, timeToTick]);
      
      const noteRegions = getNoteRegions();
      
      const handleTouchStart = (e) => setTouchStart(e.touches[0].clientY);
      const handleTouchMove = (e) => {
        if (touchStart === null) return;
        const delta = touchStart - e.touches[0].clientY;
        // Require more movement before triggering a grid snap
        if (Math.abs(delta) > 20) {
          // Move by one grid unit in the swipe direction
          let direction = delta > 0 ? 1 : -1;
          if (reverseScroll) direction = -direction;
          moveByGrid(direction);
          setTouchStart(e.touches[0].clientY);
        }
      };
      const handleTouchEnd = () => setTouchStart(null);
      
      const snapToGrid = (tick) => Math.round(tick / gridSnap) * gridSnap;
      
      const toggleNoteAtCurrent = (lane) => {
        const snapped = snapToGrid(currentTick);
        const idx = notes.findIndex(n => n.tick === snapped && n.lane === lane);
        if (idx >= 0) {
          setNotes(notes.filter((_, i) => i !== idx));
        } else {
          const flags = (tapMode ? NoteFlags.TAP : 0) | (forceMode ? NoteFlags.FORCED : 0);
          setNotes([...notes, { tick: snapped, lane, duration: 0, flags }].sort((a, b) => a.tick - b.tick));
        }
      };
      
      // Toggle open note (purple bar)
      const toggleOpenNote = () => {
        const snapped = snapToGrid(currentTick);
        const idx = notes.findIndex(n => n.tick === snapped && n.lane === OPEN_LANE);
        if (idx >= 0) {
          setNotes(notes.filter((_, i) => i !== idx));
        } else {
          const flags = (tapMode ? NoteFlags.TAP : 0) | (forceMode ? NoteFlags.FORCED : 0);
          setNotes([...notes, { tick: snapped, lane: OPEN_LANE, duration: 0, flags }].sort((a, b) => a.tick - b.tick));
        }
      };
      
      // Sustain functions
      const toggleSustainMode = (lane, isOpen = false) => {
        const targetLane = isOpen ? OPEN_LANE : lane;
        const existingIndex = sustainModes.findIndex(s => s.lane === targetLane);
        
        if (existingIndex >= 0) {
          // Already in sustain mode for this lane - remove it
          setSustainModes(sustainModes.filter((_, i) => i !== existingIndex));
        } else {
          // Find if there's a note at or before current position in this lane
          const snapped = snapToGrid(currentTick);
          
          // Look for a note that could have a sustain at current position
          const noteAtCurrent = notes.find(n => n.lane === targetLane && n.tick === snapped);
          
          if (noteAtCurrent) {
            // Start sustain mode from this note - track by tick+lane, not index
            setSustainModes([...sustainModes, {
              lane: targetLane,
              noteTick: noteAtCurrent.tick,
              mode: 'extend'
            }]);
          } else {
            // Check if we're at the end of an existing sustain (to shrink it)
            const noteWithSustainHere = notes.find(n => 
              n.lane === targetLane && 
              n.duration > 0 && 
              n.tick + n.duration === snapped
            );
            
            if (noteWithSustainHere) {
              setSustainModes([...sustainModes, {
                lane: targetLane,
                noteTick: noteWithSustainHere.tick,
                mode: 'shrink'
              }]);
            } else {
              // Check if we're inside a sustain (to truncate it)
              const noteContainingTick = notes.find(n =>
                n.lane === targetLane &&
                n.duration > 0 &&
                n.tick < snapped &&
                n.tick + n.duration > snapped
              );
              
              if (noteContainingTick) {
                // Truncate sustain to current position
                setNotes(notes.map(n => 
                  n.tick === noteContainingTick.tick && n.lane === targetLane
                    ? { ...n, duration: snapped - n.tick }
                    : n
                ));
              }
            }
          }
        }
      };
      
      // Update all active sustains when scrolling
      const sustainModesRef = useRef(sustainModes);
      sustainModesRef.current = sustainModes;
      
      useEffect(() => {
        if (sustainModes.length === 0) return;
        
        const snapped = snapToGrid(currentTick);
        const currentSustainModes = sustainModesRef.current;
        
        // Check if any notes need updating
        let needsUpdate = false;
        for (const sustainMode of currentSustainModes) {
          const note = notes.find(n => n.lane === sustainMode.lane && n.tick === sustainMode.noteTick);
          if (note) {
            const newDuration = Math.max(0, snapped - note.tick);
            if (newDuration !== note.duration) {
              needsUpdate = true;
              break;
            }
          }
        }
        
        if (!needsUpdate) return;
        
        const newNotes = notes.map(note => {
          const sustainMode = currentSustainModes.find(s => s.lane === note.lane && s.noteTick === note.tick);
          if (!sustainMode) return note;
          
          const newDuration = Math.max(0, snapped - note.tick);
          if (newDuration !== note.duration) {
            return { ...note, duration: newDuration };
          }
          return note;
        });
        
        setNotes(newNotes);
      }, [sustainModes.length > 0 ? snapToGrid(currentTick) : null]);
      
      // Selection functions
      const setSelectionStartHere = () => {
        setSelectionStart(snapToGrid(currentTick));
        setIsSelectingStart(true);
        setSelectionEnd(null);
      };
      
      const setSelectionEndHere = () => {
        setSelectionEnd(snapToGrid(currentTick));
        setIsSelectingStart(false);
      };
      
      const clearSelection = () => {

        setSelectionEnd(null);
        setIsSelectingStart(false);

      // Live selection end (shows highlight while scrolling after Set Start)

      const copySelection = () => {

        const start = Math.min(selectionStart, liveSelectionEnd);
        const end = Math.max(selectionStart, liveSelectionEnd);
        
        const selectedNotes = notes.filter(n => n.tick >= start && n.tick <= end);
        // Store notes relative to selection start
        const relativized = selectedNotes.map(n => ({
          ...n,
          tick: n.tick - start

        setClipboard(relativized);
        setIsSelectingStart(false);

        // Merge with existing notes, avoiding duplicates
        const merged = [...notes];
        for (const nn of newNotes) {
          const exists = merged.some(n => n.tick === nn.tick && n.lane === nn.lane);
          if (!exists) {

          }

        const start = Math.min(selectionStart, liveSelectionEnd);
        const end = Math.max(selectionStart, liveSelectionEnd);
        return tick >= start && tick <= end;
      };
      
      // Chart management functions
      const getChartKey = (diff, inst) => `${diff}${inst}`;
      const chartExists = (diff, inst) => {
        const key = getChartKey(diff, inst);
        return charts[key] && charts[key].length > 0;
      };

          setCharts(prev => ({ ...prev, [key]: [...sourceNotes] }));

          setCharts(prev => ({ ...prev, [key]: [] }));
        }
        setCurrentDifficulty(difficulty);
        setCurrentInstrument(instrument);
        setShowAddChart(false);
      };
      
      // Add 3 seconds silence
      const addSilence = () => {
        if (firstBeat < 3) {
          setFirstBeat(3);
        }
        setShowMenu(false);
        alert('First beat set to 3 seconds. Make sure your audio file has at least 3 seconds of silence at the start, or add it using an audio editor.');
      };
      
      // Lyrics functions
      const [lyricsSearchQuery, setLyricsSearchQuery] = useState('');
      
      const searchLyrics = async () => {
        if (!artistName || !songName) {
          setLyricsError('Need artist and song name to search');
          return;
        }
        
        const query = `${artistName} - ${songName}`;
        setLyricsSearchQuery(query);
        setLyricsSearching(true);
        setLyricsError(null);
        
        try {
          const response = await fetch(
            `${API_URL}/lyrics/search?artist=${encodeURIComponent(artistName)}&title=${encodeURIComponent(songName)}`,
            { signal: AbortSignal.timeout(15000) }  // 15 second timeout
          );
          const data = await response.json();
          
          if (data.success && data.lines) {
            // Convert plain lyrics to timed format (user will need to sync)
            const timedLyrics = data.lines.map((text, i) => ({
              time: null,  // No timing yet
              text: text,
              synced: false
            }));
            setLyrics(timedLyrics);
            setLyricsError(null);
          } else {
            setLyricsError(data.error || 'No lyrics found for "' + query + '"');
          }
        } catch (err) {
          if (err.name === 'TimeoutError' || err.message.includes('timeout')) {
            setLyricsError('Search timed out. Try importing an LRC file instead.');
          } else {
            setLyricsError('Search failed: ' + err.message);
          }
        } finally {
          setLyricsSearching(false);
        }
      };
      
      const parseLrcLyrics = async (lrcText) => {
        try {
          const response = await fetch(`${API_URL}/lyrics/parse`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lrc: lrcText })
          });
          const data = await response.json();
          
          if (data.success && data.lines) {
            const timedLyrics = data.lines.map(line => ({
              time: line.time,
              text: line.text,
              synced: true
            }));
            setLyrics(timedLyrics);
            setLyricsError(null);
          } else {
            setLyricsError(data.error || 'Failed to parse LRC');
          }
        } catch (err) {
          setLyricsError('Failed to parse LRC: ' + err.message);
        }
      };
      
      const syncLyricLine = (index) => {
        // Set the current lyric line to the current time
        setLyrics(prev => prev.map((line, i) => 
          i === index ? { ...line, time: currentTime + lyricsOffset, synced: true } : line
        ));
      };
      
      const clearLyricTiming = (index) => {
        setLyrics(prev => prev.map((line, i) => 
          i === index ? { ...line, time: null, synced: false } : line
        ));
      };
      
      const autoSyncLyrics = () => {
        // Simple auto-sync: distribute lyrics evenly across the song
        if (lyrics.length === 0 || duration === 0) return;
        
        const startTime = firstBeat + lyricsOffset;
        const endTime = duration - 5;  // Leave some buffer at end
        const interval = (endTime - startTime) / lyrics.length;
        
        setLyrics(prev => prev.map((line, i) => ({
          ...line,
          time: startTime + (i * interval),
          synced: true
        })));
      };
      
      const getLyricAtTime = (time) => {
        const adjusted = time - lyricsOffset;
        const synced = lyrics.filter(l => l.synced && l.time !== null);
        if (synced.length === 0) return null;
        
        // Find the most recent lyric
        let current = null;
        for (const line of synced) {
          if (line.time <= adjusted) {
            current = line;
          } else {
            break;
          }
        }
        return current;
      };
      
      const currentLyric = getLyricAtTime(currentTime);
      
      const exportChart = () => {
        const lines = [
          '[Song]', '{',

          `  Charter = "${charter}"`,
          `  Offset = ${-firstBeat.toFixed(3)}`,
          '  Resolution = 192',
          '  Player2 = bass',
          '  Difficulty = 0',
          `  PreviewStart = ${previewStart.toFixed(3)}`,
          `  PreviewEnd = ${previewEnd.toFixed(3)}`,
          '  MediaType = "cd"',
          `  MusicStream = "${audioFileName || 'song.ogg'}"`,
          '}',
          '[SyncTrack]', '{',
          '  0 = TS 4',
          ...tempoMap.map(t => `  ${t.tick} = B ${Math.round(t.bpm * 1000)}`),
          '}'
        ];
        
        // Export lyrics as events
        const syncedLyrics = lyrics.filter(l => l.synced && l.time !== null);
        if (syncedLyrics.length > 0) {
          lines.push('[Events]', '{');
          syncedLyrics.forEach(lyric => {
            const tick = Math.round(timeToTick(lyric.time - lyricsOffset));
            // Clone Hero lyric format: tick = E "lyric text"

              // Forced flag (note type 5)  
              if (n.flags & NoteFlags.FORCED) {
                lines.push(`  ${n.tick} = N 5 0`);
              }
            });
            lines.push('}');
          }
        });
        
        const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${songName}.chart`;
        a.click();
        URL.revokeObjectURL(url);
        setShowMenu(false);
      };
      
      const formatTime = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
      
      // Resume screen
      if (screen === 'resume' && pendingLoadData) {

      }
      
      // Upload screen
      if (screen === 'upload') {

                <input

                  <input type="text" value={year} onChange={(e) => setYear(e.target.value)}

                <div className="flex gap-1 mb-1">

                </div>
                
                {/* Lyrics list */}
                <div className="flex-1 overflow-y-auto min-h-[200px] bg-gray-900 rounded p-2">
                  {lyrics.length === 0 ? (
                    <div className="text-center text-gray-500 py-8">
                      <p>No lyrics loaded</p>
                      <p className="text-xs mt-2">Search by artist/title or import an LRC file</p>
                    </div>
                  ) : (
                    <div className="space-y-1">
                      {lyrics.map((line, i) => (
                        <div 
                          key={i} 
                          className={`flex items-center gap-2 p-1 rounded text-sm ${
                            currentLyric === line ? 'bg-green-900' : 'hover:bg-gray-800'
                          }`}
                        >
                          <button
                            onClick={() => syncLyricLine(i)}
                            className="px-2 py-0.5 bg-blue-600 rounded text-xs shrink-0"
                            title="Set timing to current position"
                          >
                            Sync
                          </button>
                          <span className="w-16 text-xs text-gray-400 shrink-0">
                            {line.synced && line.time !== null ? formatTime(line.time) : '--:--'}
                          </span>
                          <span className="flex-1 truncate">{line.text}</span>
                          {line.synced && (
                            <button
                              onClick={() => clearLyricTiming(i)}
                              className="text-red-400 hover:text-red-300 text-xs shrink-0"
                              title="Clear timing"
                            >
                              ✕
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                
                {/* Manual add */}
                <div className="mt-3 flex gap-2">
                  <input
                    type="text"
                    placeholder="Add lyric line manually..."
                    className="flex-1 bg-gray-700 rounded px-2 py-1 text-sm"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && e.target.value.trim()) {
                        setLyrics(prev => [...prev, { time: null, text: e.target.value.trim(), synced: false }]);
                        e.target.value = '';
                      }
                    }}
                  />
                  <button 
                    onClick={() => setLyrics([])}
                    className="px-3 py-1 bg-red-900 rounded text-sm"
                  >
                    Clear All
                  </button>
                </div>
                
                <div className="mt-3 text-xs text-gray-500">
                  {lyrics.filter(l => l.synced).length}/{lyrics.length} lines synced • 
                  Tip: Play song, press Sync when each line should appear
                </div>
              </div>
            </div>
          )}
          
          {/* Edit Toolbar - mobile only */}
          {showEditMenu && (
            <div className="bg-gray-800 border-b border-gray-700 p-2 flex flex-col gap-2 mobile-only">
              <div className="flex items-center gap-2">
                <button 
                  onClick={setSelectionStartHere} 
                  className={`px-2 py-1 rounded text-xs ${isSelectingStart ? 'bg-purple-500' : 'bg-purple-700'}`}
                >
                  {isSelectingStart ? 'Setting...' : 'Start'}
                </button>
                <button 
                  onClick={setSelectionEndHere} 
                  disabled={selectionStart === null}
                  className="px-2 py-1 bg-purple-700 rounded text-xs disabled:opacity-30"
                >
                  End
                </button>
                <span className="text-xs text-gray-400 flex-1 text-center">
                  {selectionStart !== null && liveSelectionEnd !== null 
                    ? `Beat ${Math.floor(Math.min(selectionStart, liveSelectionEnd)/RESOLUTION)}-${Math.floor(Math.max(selectionStart, liveSelectionEnd)/RESOLUTION)}`
                    : selectionStart !== null ? 'Scroll to select...' : 'No selection'}
                </span>
                <button onClick={clearSelection} className="px-2 py-1 bg-gray-700 rounded text-xs">
                  Clear
                </button>
                <button onClick={() => setShowEditMenu(false)} className="px-2 py-1 bg-gray-600 rounded text-xs">
                  ✕
                </button>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => nudgeSelection(-1)}
                  disabled={selectionStart === null || liveSelectionEnd === null}
                  className="px-2 py-1 bg-gray-700 rounded text-xs disabled:opacity-30"
                >
                  ← Nudge
                </button>
                <button 
                  onClick={copySelection} 
                  disabled={selectionStart === null || liveSelectionEnd === null}
                  className="px-2 py-1 bg-blue-600 rounded text-xs disabled:opacity-30"
                >
                  Copy
                </button>
                <button 
                  onClick={pasteAtCurrent}
                  disabled={clipboard.length === 0}
                  className="px-2 py-1 bg-green-600 rounded text-xs disabled:opacity-30"
                >
                  Paste{clipboard.length > 0 ? ` (${clipboard.length})` : ''}
                </button>
                <button 
                  onClick={deleteSelection}
                  disabled={selectionStart === null || liveSelectionEnd === null}
                  className="px-2 py-1 bg-red-600 rounded text-xs disabled:opacity-30"
                >
                  Delete
                </button>
                <button 
                  onClick={() => nudgeSelection(1)}
                  disabled={selectionStart === null || liveSelectionEnd === null}
                  className="px-2 py-1 bg-gray-700 rounded text-xs disabled:opacity-30"
                >
                  Nudge →
                </button>
              </div>
            </div>
          )}
          
          {/* Top controls - mobile only */}
          <div className="bg-gray-800 p-2 flex flex-col gap-1.5 flex-shrink-0 mobile-only">
            {/* Row 1: Menu, song name, edit, export */}
            <div className="flex items-center gap-2">
              <button onClick={() => setShowMenu(true)} className="px-2 py-1 bg-gray-700 rounded text-sm">☰</button>
              <input
                type="text"
                value={songName}
                onChange={(e) => setSongName(e.target.value)}
                className="flex-1 bg-gray-700 text-white text-sm px-2 py-1 rounded truncate"
                placeholder="Song name"
              />
              <button onClick={() => setShowEditMenu(true)} className="px-2 py-1 bg-purple-600 rounded text-sm">✂️</button>
              <button onClick={exportChart} className="px-2 py-1 bg-green-600 rounded text-sm">Export</button>
            </div>
            
            {/* Row 2: Instrument and Difficulty selector */}
            <div className="flex items-center gap-2">
              <select 
                value={currentInstrument} 
                onChange={(e) => setCurrentInstrument(e.target.value)}
                className="bg-gray-700 rounded px-2 py-0.5 text-xs"
              >
                {Object.entries(INSTRUMENTS).map(([key, inst]) => (
                  <option key={key} value={key}>{inst.name}</option>
                ))}
              </select>
              <select 
                value={currentDifficulty} 
                onChange={(e) => setCurrentDifficulty(e.target.value)}
                className="bg-gray-700 rounded px-2 py-0.5 text-xs"
              >
                {DIFFICULTIES.map(diff => (
                  <option key={diff} value={diff}>
                    {diff} {chartExists(diff, currentInstrument) ? `(${charts[getChartKey(diff, currentInstrument)]?.length || 0})` : ''}
                  </option>
                ))}
              </select>
              <span className="text-xs text-gray-500">|</span>
              <span className="text-xs text-gray-400">Grid:</span>
              <button
                onClick={() => setGridSnap(RESOLUTION)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === RESOLUTION ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                1
              </button>
              <button
                onClick={() => setGridSnap(HALF_BEAT)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === HALF_BEAT ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                ½
              </button>
              <button
                onClick={() => setGridSnap(RESOLUTION/4)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === RESOLUTION/4 ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                ¼
              </button>
              <button
                onClick={() => setReverseScroll(!reverseScroll)}
                className={`ml-auto px-1.5 py-0.5 rounded text-xs ${reverseScroll ? 'bg-yellow-600' : 'bg-gray-700'}`}
                title="Reverse scroll direction"
              >
                {reverseScroll ? '⇅' : '⇵'}
              </button>
            </div>
            
            {/* Row 3: Playback */}
            <div className="flex items-center gap-2">
              <button
                onClick={togglePlay}
                disabled={!audioReady}
                className={`w-10 h-8 rounded text-lg ${audioReady ? 'bg-green-600' : 'bg-gray-700 opacity-50'}`}
              >
                {isPlaying ? '⏸' : '▶'}
              </button>
              {[0.25, 0.5, 0.75, 1.0].map(rate => (
                <button
                  key={rate}
                  onClick={() => handleRateChange(rate)}
                  className={`px-2 py-1 rounded text-xs ${playbackRate === rate ? 'bg-blue-600' : 'bg-gray-700'}`}
                >
                  {rate === 1 ? '1x' : `${Math.round(rate*100)}%`}
                </button>
              ))}
              <span className="text-sm text-yellow-400 ml-auto">{currentBpm} BPM</span>
            </div>
            
            {/* Row 4: Time + progress */}
            <div className="flex items-center gap-2">
              <span className="font-mono text-sm w-10">{formatTime(currentTime)}</span>
              <div 
                className="flex-1 h-4 bg-gray-700 rounded overflow-hidden relative cursor-pointer"
                onClick={handleProgressBarClick}
              >
                {/* Note regions - show where notes exist */}
                {noteRegions.map((region, i) => (
                  <div
                    key={i}
                    className="absolute top-0 bottom-0 bg-green-600 opacity-60"
                    style={{ left: `${region.start}%`, width: `${region.width}%` }}
                  />
                ))}
                {/* Progress overlay */}
                <div 
                  className="absolute top-0 bottom-0 left-0 bg-blue-500 opacity-50"
                  style={{ width: `${progressPercent}%` }}
                />
                {/* Playhead line */}
                <div 
                  className="absolute top-0 bottom-0 w-0.5 bg-white"
                  style={{ left: `${progressPercent}%` }}
                />
              </div>
              <span className="font-mono text-sm w-10 text-right">{formatTime(duration)}</span>
            </div>
            
            {/* Row 5: Navigation */}
            <div className="flex items-center justify-center gap-1">
              <button onClick={() => moveByBeats(-4)} className="px-2 py-1 bg-gray-700 rounded text-xs">-4</button>
              <button onClick={() => moveByBeats(-1)} className="px-2 py-1 bg-gray-700 rounded text-xs">-1</button>
              <button onClick={() => moveByGrid(-1)} className="px-2 py-1 bg-gray-600 rounded text-xs">◀</button>
              <span className="text-xs text-gray-400 w-16 text-center">Beat {Math.floor(currentTick / RESOLUTION)}</span>
              <button onClick={() => moveByGrid(1)} className="px-2 py-1 bg-gray-600 rounded text-xs">▶</button>
              <button onClick={() => moveByBeats(1)} className="px-2 py-1 bg-gray-700 rounded text-xs">+1</button>
              <button onClick={() => moveByBeats(4)} className="px-2 py-1 bg-gray-700 rounded text-xs">+4</button>
            </div>
          </div>
          
          {/* Desktop header - minimal playback controls */}
          <div className="bg-gray-800 p-2 flex items-center gap-3 flex-shrink-0 desktop-only" style={{display: 'none'}}>
            <button
              onClick={togglePlay}
              disabled={!audioReady}
              className={`w-12 h-8 rounded ${isPlaying ? 'bg-yellow-600' : 'bg-green-600'} disabled:opacity-50 flex items-center justify-center`}
            >
              {isPlaying ? '⏸' : '▶'}
            </button>
            <span className="font-mono text-sm">{formatTime(currentTime)} / {formatTime(duration)}</span>
            <span className="text-yellow-400 text-sm">{currentBpm} BPM</span>
            <span className="text-gray-400 text-sm">Beat {Math.floor(currentTick / RESOLUTION)}</span>
            <div className="flex-1"></div>
            <span className="text-sm text-blue-400">{currentDifficulty} {instrumentConfig.name}</span>
            <span className="text-sm text-gray-400">{notes.length} notes</span>
          </div>
          
          {/* Highway */}
          <div 
            className="flex-1 flex relative touch-none"
            style={{ overflow: 'hidden', clipPath: 'inset(0)' }}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
          >
            {/* Waveform - behind everything */}
            {waveformData && waveformData.length > 0 && (
              <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                {(() => {
                  // Use tick-based positioning to match the note grid
                  const startTick = currentTick - ticksVisible / 2;
                  const endTick = currentTick + ticksVisible / 2;
                  const startTime = Math.max(0, tickToTime(Math.max(0, startTick)));
                  const endTime = tickToTime(endTick);
                  
                  // Get samples in visible time range
                  const visible = waveformData.filter(w => w.time >= startTime - 0.5 && w.time <= endTime + 0.5);
                  
                  return visible.map((sample, i) => {
                    // Convert sample time to tick position
                    const sampleTick = timeToTick(sample.time);
                    // Use same positioning as notes
                    const yPercent = 50 - ((sampleTick - currentTick) / (ticksVisible / 2)) * 50;
                    
                    if (yPercent < -2 || yPercent > 102) return null;
                    
                    const widthPx = Math.max(4, Math.round(sample.value * 120)); // Fixed pixel width
                    
                    return (
                      <div
                        key={i}
                        className="absolute bg-cyan-500 opacity-20 rounded-sm"
                        style={{
                          top: `${yPercent}%`,
                          left: '50%',
                          marginLeft: `-${widthPx / 2}px`,
                          width: `${widthPx}px`,
                          height: '3px'
                        }}
                      />
                    );
                  });
                })()}
              </div>
            )}
            
            {/* Selection highlight */}
            {selectionStart !== null && liveSelectionEnd !== null && (
              <div 
                className="absolute left-0 right-0 bg-purple-500 opacity-30 pointer-events-none z-5"
                style={{
                  top: `${getNoteY(Math.max(selectionStart, liveSelectionEnd))}%`,
                  bottom: `${100 - getNoteY(Math.min(selectionStart, liveSelectionEnd))}%`
                }}
              />
            )}
            
            {/* Grid lines */}
            <div className="absolute inset-0 pointer-events-none z-10">
              {Array.from({ length: beatsVisible * 4 + 1 }, (_, i) => {
                const offset = i - beatsVisible * 2;
                const tick = snapToGrid(currentTick) + (offset * gridSnap);
                const y = getNoteY(tick);
                const isBeat = tick % RESOLUTION === 0;
                const isMeasure = tick % (RESOLUTION * 4) === 0;
                if (y < -5 || y > 105) return null;
                return (
                  <div
                    key={i}
                    className={`absolute w-full ${
                      isMeasure ? 'border-t-2 border-gray-400' : 
                      isBeat ? 'border-t border-gray-500' : 
                      'border-t border-gray-700 border-dashed'
                    }`}
                    style={{ top: `${y}%` }}
                  />
                );
              })}
              <div className="absolute w-full h-1 bg-white" style={{ top: '50%', transform: 'translateY(-50%)', boxShadow: '0 0 10px rgba(255,255,255,0.8)' }} />
            </div>
            
            {/* Lanes */}
            {instrumentConfig.colors.map((color, idx) => (
              <div
                key={idx}
                className="flex-1 relative overflow-hidden"
                style={{ backgroundColor: `${color}08`, borderRight: idx < instrumentConfig.lanes - 1 ? '1px solid #374151' : 'none' }}
              >
                {visibleNotes.filter(n => n.lane === idx).map(note => {
                  const noteY = getNoteY(note.tick);
                  const dur = note.duration || 0;
                  const showSustain = dur > 0;
                  const sustainEndY = showSustain ? getNoteY(note.tick + dur) : noteY;
                  const isTap = (note.flags || 0) & NoteFlags.TAP;
                  const isForced = (note.flags || 0) & NoteFlags.FORCED;
                  
                  return (
                    <React.Fragment key={`${note.tick}-${note.lane}`}>
                      {showSustain ? (
                        <div
                          className="absolute left-1/2 w-3 rounded-sm"
                          style={{
                            backgroundColor: color,
                            opacity: 0.7,
                            top: `${Math.min(noteY, sustainEndY)}%`,
                            height: `${Math.abs(noteY - sustainEndY)}%`,
                            transform: 'translateX(-50%)',
                          }}
                        />
                      ) : null}
                      <div
                        className="absolute left-1/2 w-10 h-4 rounded-full"
                        style={{
                          backgroundColor: isTap || isForced ? 'transparent' : color,
                          border: isTap ? `3px solid ${color}` : isForced ? `3px dashed ${color}` : 'none',
                          top: `${noteY}%`,
                          transform: 'translate(-50%, -50%)',
                          boxShadow: isTap || isForced ? 'none' : `0 0 8px ${color}`,
                          outline: isInSelection(note.tick) ? '2px solid white' : 'none'
                        }}
                      />
                      {showSustain ? (
                        <div
                          className="absolute left-1/2 w-6 h-2 rounded-sm"
                          style={{
                            backgroundColor: color,
                            top: `${sustainEndY}%`,
                            transform: 'translate(-50%, -50%)',
                          }}
                        />
                      ) : null}
                    </React.Fragment>
                  );
                })}
              </div>
            ))}
            
            {/* Open notes (purple bar across all lanes) */}
            {instrumentConfig.hasOpen && visibleNotes.filter(n => n.lane === OPEN_LANE).map(note => {
              const noteY = getNoteY(note.tick);
              const dur = note.duration || 0;
              const showSustain = dur > 0;
              const sustainEndY = showSustain ? getNoteY(note.tick + dur) : noteY;
              const isTap = (note.flags || 0) & NoteFlags.TAP;
              const isForced = (note.flags || 0) & NoteFlags.FORCED;
              
              return (
                <React.Fragment key={`open-${note.tick}`}>
                  {showSustain ? (
                    <div
                      className="absolute left-1/4 right-1/4 rounded-sm z-20 pointer-events-none"
                      style={{
                        backgroundColor: '#a855f7',
                        opacity: 0.7,
                        top: `${Math.min(noteY, sustainEndY)}%`,
                        height: `${Math.abs(noteY - sustainEndY)}%`,
                      }}
                    />
                  ) : null}
                  <div
                    className="absolute left-4 right-4 h-3 rounded z-20 pointer-events-none"
                    style={{
                      backgroundColor: isTap || isForced ? 'transparent' : '#a855f7',
                      border: isTap ? '3px solid #a855f7' : isForced ? '3px dashed #a855f7' : 'none',
                      top: `${noteY}%`,
                      transform: 'translateY(-50%)',
                      boxShadow: isTap || isForced ? 'none' : '0 0 8px #a855f7',
                      outline: isInSelection(note.tick) ? '2px solid white' : 'none'
                    }}
                  />
                </React.Fragment>
              );
            })}
            
            {notes.length === 0 && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span className="text-gray-600 text-sm">Swipe to scroll • Tap lanes below</span>
              </div>
            )}
          </div>
          
          {/* Note count + selection info */}
          <div className="bg-gray-800 py-1 text-center flex-shrink-0 flex justify-center gap-4">
            <span className="text-xs text-gray-400">{notes.length} notes</span>
            {sustainModes.length > 0 && (
              <span className="text-xs text-yellow-400">
                SUSTAIN: {sustainModes.map(s => s.lane === OPEN_LANE ? 'OPEN' : instrumentConfig.labels[s.lane]).join('+')}
              </span>
            )}
            {proMode && (tapMode || forceMode) ? (
              <span className="text-xs text-cyan-400">{tapMode ? 'TAP ' : ''}{forceMode ? 'FORCE' : ''}</span>
            ) : null}
            {clipboard.length > 0 && <span className="text-xs text-purple-400">📋 {clipboard.length}</span>}
            {lastSaved && <span className="text-xs text-gray-600">saved {lastSaved.toLocaleTimeString()}</span>}
          </div>
          
          {/* Open note button (Pro Mode only, guitar/bass only) */}
          {proMode && instrumentConfig.hasOpen && (
            <div className="flex h-10 flex-shrink-0 border-t border-gray-700">
              <button
                className="flex-1 flex items-center justify-center text-lg font-bold active:brightness-75"
                style={{ backgroundColor: '#a855f7', boxShadow: 'inset 0 -2px 4px rgba(0,0,0,0.3)' }}
                onClick={toggleOpenNote}
              >
                OPEN
              </button>
              {instrumentConfig.hasSustain && (
                <button
                  className="w-16 flex items-center justify-center text-xs font-bold active:brightness-75"
                  style={{ 
                    backgroundColor: sustainModes.some(s => s.lane === OPEN_LANE) ? '#fff' : '#a855f799',
                    color: sustainModes.some(s => s.lane === OPEN_LANE) ? '#a855f7' : '#fff',
                    boxShadow: 'inset 0 2px 4px rgba(0,0,0,0.4)'
                  }}
                  onClick={() => toggleSustainMode(0, true)}
                >
                  {sustainModes.some(s => s.lane === OPEN_LANE) ? '●' : 'SUS'}
                </button>
              )}
            </div>
          )}
          
          {/* Lane buttons */}
          <div className={`flex flex-shrink-0 ${proMode ? 'h-24' : 'h-20'}`}>
            {instrumentConfig.colors.map((color, idx) => (
              <div key={idx} className="flex-1 flex flex-col">
                {/* Main note button */}
                <button
                  className="flex-1 flex items-center justify-center text-2xl font-bold active:brightness-75"
                  style={{ backgroundColor: color, boxShadow: 'inset 0 -2px 4px rgba(0,0,0,0.3)' }}
                  onClick={() => toggleNoteAtCurrent(idx)}
                >
                  {instrumentConfig.labels[idx]}
                </button>
                {/* Bottom row: Sustain (+ Tap/Force in pro mode) */}
                <div className="flex h-6">
                  {instrumentConfig.hasSustain && (
                    <button
                      className="flex-1 flex items-center justify-center text-xs font-bold active:brightness-75"
                      style={{ 
                        backgroundColor: sustainModes.some(s => s.lane === idx) ? '#fff' : `${color}99`,
                        color: sustainModes.some(s => s.lane === idx) ? color : '#fff',
                        boxShadow: 'inset 0 2px 4px rgba(0,0,0,0.4)'
                      }}
                      onClick={() => toggleSustainMode(idx)}
                    >
                      {sustainModes.some(s => s.lane === idx) ? '●' : '―'}
                    </button>
                  )}
                  {proMode && (
                    <>
                      <button
                        className={`flex-1 flex items-center justify-center text-xs font-bold active:brightness-75 ${tapMode ? 'bg-cyan-500' : 'bg-gray-700'}`}
                        onClick={() => setTapMode(!tapMode)}
                      >
                        T
                      </button>
                      <button
                        className={`flex-1 flex items-center justify-center text-xs font-bold active:brightness-75 ${forceMode ? 'bg-orange-500' : 'bg-gray-700'}`}
                        onClick={() => setForceMode(!forceMode)}
                      >
                        F
                      </button>
                    </>
                  )}
                  {!instrumentConfig.hasSustain && !proMode && (
                    <div className="flex-1 bg-gray-800" />
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
        </div>
        
        {/* Right side panel (desktop only) */}
        <SidePanel side="right" />
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<ChartMaker />);
  </script>
</body>
</html>
