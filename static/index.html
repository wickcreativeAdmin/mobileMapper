<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ChartMaker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;
    
    const API_URL = '';
    
    const LANES = 5;
    const LANE_COLORS = ['#22c55e', '#ef4444', '#eab308', '#3b82f6', '#f97316'];
    const LANE_LABELS = ['G', 'R', 'Y', 'B', 'O'];
    const RESOLUTION = 192;
    const HALF_BEAT = RESOLUTION / 2; // 96 ticks
    const AUTOSAVE_KEY = 'chartmaker_autosave';
    const AUTOSAVE_INTERVAL = 5000;
    
    function ChartMaker() {
      // App state
      const [screen, setScreen] = useState('upload');
      
      // Audio state
      const [audioFile, setAudioFile] = useState(null);
      const [audioFileName, setAudioFileName] = useState('');
      const [audioUrl, setAudioUrl] = useState(null);
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const [audioReady, setAudioReady] = useState(false);
      const [waveformData, setWaveformData] = useState(null);
      
      // Analysis state
      const [analysisError, setAnalysisError] = useState(null);
      const [analysisProgress, setAnalysisProgress] = useState('');
      
      // Chart state
      const [tempoMap, setTempoMap] = useState([{ tick: 0, bpm: 120 }]);
      const [tempoMapType, setTempoMapType] = useState('measure');
      const [allTempoMaps, setAllTempoMaps] = useState(null);
      const [firstBeat, setFirstBeat] = useState(0);
      const [notes, setNotes] = useState([]);
      const [songName, setSongName] = useState('Untitled');
      const [artistName, setArtistName] = useState('Unknown');
      const [gridSnap, setGridSnap] = useState(HALF_BEAT); // Default to half-beat
      
      // Selection/Copy state
      const [selectionStart, setSelectionStart] = useState(null);
      const [selectionEnd, setSelectionEnd] = useState(null);
      const [clipboard, setClipboard] = useState([]);
      const [showEditMenu, setShowEditMenu] = useState(false);
      
      // Sustain mode state
      const [sustainMode, setSustainMode] = useState(null); // null or { lane, startTick, noteIndex }
      
      // Save/Load state
      const [showMenu, setShowMenu] = useState(false);
      const [lastSaved, setLastSaved] = useState(null);
      const [hasAutoSave, setHasAutoSave] = useState(false);
      const [pendingLoadData, setPendingLoadData] = useState(null);
      
      // Touch state
      const [touchStart, setTouchStart] = useState(null);
      const [reverseScroll, setReverseScroll] = useState(false);
      
      // Refs
      const audioRef = useRef(null);
      const animationRef = useRef(null);
      const canvasRef = useRef(null);
      
      // Generate waveform from audio - higher resolution for highway display
      const generateWaveform = async (file) => {
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await file.arrayBuffer();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          
          const rawData = audioBuffer.getChannelData(0);
          const sampleRate = audioBuffer.sampleRate;
          const audioDuration = audioBuffer.duration;
          
          // Generate waveform data at ~100 samples per second for smooth scrolling
          const samplesPerSecond = 100;
          const totalSamples = Math.floor(audioDuration * samplesPerSecond);
          const blockSize = Math.floor(rawData.length / totalSamples);
          const waveform = [];
          
          for (let i = 0; i < totalSamples; i++) {
            let sum = 0;
            const startIdx = i * blockSize;
            for (let j = 0; j < blockSize && (startIdx + j) < rawData.length; j++) {
              sum += Math.abs(rawData[startIdx + j]);
            }
            waveform.push({
              time: i / samplesPerSecond,
              value: sum / blockSize
            });
          }
          
          // Normalize
          const max = Math.max(...waveform.map(w => w.value));
          const normalized = waveform.map(w => ({
            time: w.time,
            value: max > 0 ? w.value / max : 0
          }));
          
          setWaveformData(normalized);
          audioContext.close();
        } catch (err) {
          console.error('Waveform generation failed:', err);
        }
      };
      
      // Get visible waveform samples for the current view
      const getVisibleWaveform = useCallback(() => {
        if (!waveformData || waveformData.length === 0) return [];
        
        // Calculate time range visible on highway
        const centerTime = currentTime;
        const bpm = getCurrentBpm();
        const secondsPerBeat = 60 / bpm;
        const secondsVisible = beatsVisible * secondsPerBeat;
        const startTime = centerTime - secondsVisible / 2;
        const endTime = centerTime + secondsVisible / 2;
        
        // Filter waveform samples in visible range
        return waveformData.filter(w => w.time >= startTime && w.time <= endTime);
      }, [waveformData, currentTime, beatsVisible]);
      
      // Check for auto-save on mount
      useEffect(() => {
        const saved = localStorage.getItem(AUTOSAVE_KEY);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data && data.songName && data.notes) {
              setHasAutoSave(true);
              setPendingLoadData(data);
              setScreen('resume');
            }
          } catch (e) {
            console.error('Failed to parse autosave:', e);
            localStorage.removeItem(AUTOSAVE_KEY);
          }
        }
      }, []);
      
      // Auto-save effect
      useEffect(() => {
        if (screen !== 'chart') return;
        
        const saveData = () => {
          const data = {
            version: 2,
            savedAt: new Date().toISOString(),
            songName,
            artistName,
            audioFileName,
            duration,
            currentTime,
            firstBeat,
            tempoMap,
            tempoMapType,
            allTempoMaps,
            notes,
            playbackRate,
            gridSnap,
            reverseScroll
          };
          localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
          setLastSaved(new Date());
        };
        
        saveData();
        const interval = setInterval(saveData, AUTOSAVE_INTERVAL);
        return () => clearInterval(interval);
      }, [screen, songName, artistName, audioFileName, duration, currentTime, firstBeat, tempoMap, tempoMapType, allTempoMaps, notes, playbackRate, gridSnap, reverseScroll]);
      
      const clearAutoSave = () => {
        localStorage.removeItem(AUTOSAVE_KEY);
        setHasAutoSave(false);
      };
      
      const saveProgress = () => {
        const data = {
          version: 2,
          savedAt: new Date().toISOString(),
          songName,
          artistName,
          audioFileName,
          duration,
          currentTime,
          firstBeat,
          tempoMap,
          tempoMapType,
          allTempoMaps,
          notes,
          playbackRate,
          gridSnap,
          reverseScroll
        };
        
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${songName}_progress.chartmaker`;
        a.click();
        URL.revokeObjectURL(url);
        setShowMenu(false);
      };
      
      const handleLoadProgress = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data && data.version && data.notes) {
              setPendingLoadData(data);
              setScreen('resume');
            } else {
              alert('Invalid save file');
            }
          } catch (err) {
            alert('Failed to read save file');
          }
        };
        reader.readAsText(file);
        setShowMenu(false);
      };
      
      const resumeFromData = (data) => {
        setSongName(data.songName || 'Untitled');
        setArtistName(data.artistName || 'Unknown');
        setAudioFileName(data.audioFileName || '');
        setDuration(data.duration || 0);
        setCurrentTime(data.currentTime || 0);
        setFirstBeat(data.firstBeat || 0);
        setTempoMap(data.tempoMap || [{ tick: 0, bpm: 120 }]);
        setTempoMapType(data.tempoMapType || 'beat');
        setAllTempoMaps(data.allTempoMaps || null);
        setNotes(data.notes || []);
        setPlaybackRate(data.playbackRate || 1.0);
        setGridSnap(data.gridSnap || HALF_BEAT);
        setReverseScroll(data.reverseScroll || false);
        setPendingLoadData(null);
      };
      
      const handleResumeAudio = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !pendingLoadData) return;
        
        setAudioFile(file);
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        setAudioUrl(URL.createObjectURL(file));
        
        // Generate waveform
        generateWaveform(file);
        
        resumeFromData(pendingLoadData);
        setScreen('chart');
      };
      
      const startFresh = () => {
        clearAutoSave();
        setPendingLoadData(null);
        setScreen('upload');
      };
      
      const getCurrentBpm = useCallback(() => {
        const tick = timeToTick(currentTime);
        let bpm = tempoMap[0]?.bpm || 120;
        for (const entry of tempoMap) {
          if (entry.tick <= tick) bpm = entry.bpm;
          else break;
        }
        return bpm;
      }, [currentTime, tempoMap]);
      
      const timeToTick = useCallback((time) => {
        let tick = 0;
        let t = -firstBeat;
        let bpm = tempoMap[0]?.bpm || 120;
        let idx = 0;
        
        while (t < time && idx <= tempoMap.length) {
          const next = tempoMap[idx + 1];
          const tps = (bpm / 60) * RESOLUTION;
          
          if (next) {
            const nextTime = t + (next.tick - tick) / tps;
            if (nextTime <= time) {
              tick = next.tick;
              t = nextTime;
              bpm = next.bpm;
              idx++;
              continue;
            }
          }
          tick += (time - t) * tps;
          break;
        }
        return Math.round(tick);
      }, [tempoMap, firstBeat]);
      
      const tickToTime = useCallback((targetTick) => {
        let time = -firstBeat;
        let tick = 0;
        let bpm = tempoMap[0]?.bpm || 120;
        
        for (let i = 0; i < tempoMap.length; i++) {
          const entry = tempoMap[i];
          const next = tempoMap[i + 1];
          
          if (entry.tick > targetTick) break;
          
          if (entry.tick > tick) {
            const delta = entry.tick - tick;
            time += delta / ((bpm / 60) * RESOLUTION);
            tick = entry.tick;
          }
          bpm = entry.bpm;
          
          if (!next || next.tick > targetTick) {
            const remaining = targetTick - tick;
            time += remaining / ((bpm / 60) * RESOLUTION);
            break;
          }
        }
        return time;
      }, [tempoMap, firstBeat]);
      
      const currentTick = timeToTick(currentTime);
      const currentBpm = getCurrentBpm();
      const beatsVisible = 8;
      const ticksVisible = beatsVisible * RESOLUTION;
      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      
      const handleFileSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        setAudioFile(file);
        setAudioFileName(file.name);
        setSongName(file.name.replace(/\.[^/.]+$/, ""));
        
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        setAudioUrl(URL.createObjectURL(file));
        
        // Generate waveform
        generateWaveform(file);
        
        setScreen('analyzing');
        setAnalysisProgress('Uploading audio...');
        setAnalysisError(null);
        
        try {
          const formData = new FormData();
          formData.append('file', file);
          
          setAnalysisProgress('Analyzing tempo (this may take a moment)...');
          
          const response = await fetch(`${API_URL}/analyze`, {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (!data.success) throw new Error(data.error || 'Analysis failed');
          
          setAllTempoMaps(data.tempoMaps);
          setFirstBeat(data.firstBeat || 0);
          setDuration(data.duration);
          setTempoMap(data.tempoMaps.beat);
          setTempoMapType('beat');
          setNotes([]);
          setCurrentTime(0);
          
          setScreen('chart');
        } catch (err) {
          console.error('Analysis error:', err);
          setAnalysisError(err.message || 'Failed to analyze audio');
        }
        setAnalysisProgress('');
      };
      
      const handleTempoMapTypeChange = (type) => {
        if (allTempoMaps?.[type]) {
          setTempoMapType(type);
          setTempoMap(allTempoMaps[type]);
        }
      };
      
      const handleCanPlayThrough = () => {
        setAudioReady(true);
        if (audioRef.current) {
          audioRef.current.playbackRate = playbackRate;
        }
      };
      
      // Proper seeking function that works on mobile - snaps to grid
      const seekTo = (time, shouldSnap = true) => {
        if (!audioRef.current) return;
        let targetTime = Math.max(0, Math.min(duration, time));
        
        // Snap to grid if requested
        if (shouldSnap) {
          const targetTick = timeToTick(targetTime);
          const snappedTick = Math.round(targetTick / gridSnap) * gridSnap;
          targetTime = tickToTime(snappedTick);
          targetTime = Math.max(0, Math.min(duration, targetTime));
        }
        
        // Pause first, then seek, then update state
        const wasPlaying = isPlaying;
        if (wasPlaying) {
          audioRef.current.pause();
        }
        
        audioRef.current.currentTime = targetTime;
        setCurrentTime(targetTime);
        
        // Don't auto-resume - let user control playback
      };
      
      const updateTime = useCallback(() => {
        if (audioRef.current) setCurrentTime(audioRef.current.currentTime);
        if (isPlaying) animationRef.current = requestAnimationFrame(updateTime);
      }, [isPlaying]);
      
      useEffect(() => {
        if (isPlaying) animationRef.current = requestAnimationFrame(updateTime);
        return () => { if (animationRef.current) cancelAnimationFrame(animationRef.current); };
      }, [isPlaying, updateTime]);
      
      const togglePlay = async () => {
        if (!audioRef.current || !audioReady) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          try {
            // Ensure we're at the right position before playing
            if (Math.abs(audioRef.current.currentTime - currentTime) > 0.1) {
              audioRef.current.currentTime = currentTime;
            }
            audioRef.current.playbackRate = playbackRate;
            await audioRef.current.play();
            setIsPlaying(true);
          } catch (err) {
            console.error('Play failed:', err);
          }
        }
      };
      
      const handleRateChange = (rate) => {
        setPlaybackRate(rate);
        if (audioRef.current) audioRef.current.playbackRate = rate;
      };
      
      // Move by grid units (half-beats by default)
      const moveByGrid = (num) => {
        if (!audioRef.current || duration === 0) return;
        const target = Math.max(0, currentTick + (num * gridSnap));
        const newTime = Math.max(0, Math.min(duration, tickToTime(target)));
        seekTo(newTime);
      };
      
      const moveByBeats = (num) => {
        if (!audioRef.current || duration === 0) return;
        const target = Math.max(0, currentTick + (num * RESOLUTION));
        const newTime = Math.max(0, Math.min(duration, tickToTime(target)));
        seekTo(newTime);
      };
      
      const moveBySeconds = (sec) => {
        if (!audioRef.current || duration === 0) return;
        const newTime = Math.max(0, Math.min(duration, currentTime + sec));
        seekTo(newTime);
      };
      
      const handleTouchStart = (e) => setTouchStart(e.touches[0].clientY);
      const handleTouchMove = (e) => {
        if (touchStart === null) return;
        const delta = touchStart - e.touches[0].clientY;
        // Require more movement before triggering a grid snap
        if (Math.abs(delta) > 20) {
          // Move by one grid unit in the swipe direction
          let direction = delta > 0 ? 1 : -1;
          if (reverseScroll) direction = -direction;
          moveByGrid(direction);
          setTouchStart(e.touches[0].clientY);
        }
      };
      const handleTouchEnd = () => setTouchStart(null);
      
      const snapToGrid = (tick) => Math.round(tick / gridSnap) * gridSnap;
      
      const toggleNoteAtCurrent = (lane) => {
        const snapped = snapToGrid(currentTick);
        const idx = notes.findIndex(n => n.tick === snapped && n.lane === lane);
        if (idx >= 0) {
          setNotes(notes.filter((_, i) => i !== idx));
        } else {
          setNotes([...notes, { tick: snapped, lane, duration: 0 }].sort((a, b) => a.tick - b.tick));
        }
      };
      
      // Sustain functions
      const toggleSustainMode = (lane) => {
        if (sustainMode && sustainMode.lane === lane) {
          // Already in sustain mode for this lane - finish it
          setSustainMode(null);
        } else {
          // Find if there's a note at or before current position in this lane
          const snapped = snapToGrid(currentTick);
          
          // Look for a note that could have a sustain at current position
          // Either a note starting here, or a note with sustain passing through here
          const noteAtCurrent = notes.findIndex(n => n.lane === lane && n.tick === snapped);
          
          if (noteAtCurrent >= 0) {
            // Start sustain mode from this note
            setSustainMode({
              lane,
              startTick: notes[noteAtCurrent].tick,
              noteIndex: noteAtCurrent,
              mode: 'extend' // extending sustain forward
            });
          } else {
            // Check if we're at the end of an existing sustain (to shrink it)
            const noteWithSustainHere = notes.findIndex(n => 
              n.lane === lane && 
              n.duration > 0 && 
              n.tick + n.duration === snapped
            );
            
            if (noteWithSustainHere >= 0) {
              setSustainMode({
                lane,
                startTick: snapped,
                noteIndex: noteWithSustainHere,
                mode: 'shrink'
              });
            } else {
              // Check if we're inside a sustain (to truncate it)
              const noteContainingTick = notes.findIndex(n =>
                n.lane === lane &&
                n.duration > 0 &&
                n.tick < snapped &&
                n.tick + n.duration > snapped
              );
              
              if (noteContainingTick >= 0) {
                // Truncate sustain to current position
                const newNotes = [...notes];
                newNotes[noteContainingTick] = {
                  ...newNotes[noteContainingTick],
                  duration: snapped - newNotes[noteContainingTick].tick
                };
                setNotes(newNotes);
              }
            }
          }
        }
      };
      
      // Update sustain when scrolling in sustain mode
      useEffect(() => {
        if (!sustainMode) return;
        
        const snapped = snapToGrid(currentTick);
        const note = notes[sustainMode.noteIndex];
        if (!note) {
          setSustainMode(null);
          return;
        }
        
        if (sustainMode.mode === 'extend') {
          // Extending: duration = current position - note start
          const newDuration = Math.max(0, snapped - note.tick);
          if (newDuration !== note.duration) {
            const newNotes = [...notes];
            newNotes[sustainMode.noteIndex] = { ...note, duration: newDuration };
            setNotes(newNotes);
          }
        } else if (sustainMode.mode === 'shrink') {
          // Shrinking: we're moving backward from the end
          const newDuration = Math.max(0, snapped - note.tick);
          if (newDuration !== note.duration && snapped >= note.tick) {
            const newNotes = [...notes];
            newNotes[sustainMode.noteIndex] = { ...note, duration: newDuration };
            setNotes(newNotes);
          }
        }
      }, [currentTick, sustainMode]);
      
      // Selection functions
      const setSelectionStartHere = () => {
        setSelectionStart(snapToGrid(currentTick));
      };
      
      const setSelectionEndHere = () => {
        setSelectionEnd(snapToGrid(currentTick));
      };
      
      const clearSelection = () => {
        setSelectionStart(null);
        setSelectionEnd(null);
      };
      
      const copySelection = () => {
        if (selectionStart === null || selectionEnd === null) return;
        const start = Math.min(selectionStart, selectionEnd);
        const end = Math.max(selectionStart, selectionEnd);
        
        const selectedNotes = notes.filter(n => n.tick >= start && n.tick <= end);
        // Store notes relative to selection start
        const relativized = selectedNotes.map(n => ({
          ...n,
          tick: n.tick - start
        }));
        setClipboard(relativized);
      };
      
      const pasteAtCurrent = () => {
        if (clipboard.length === 0) return;
        const pasteAt = snapToGrid(currentTick);
        
        const newNotes = clipboard.map(n => ({
          ...n,
          tick: n.tick + pasteAt
        }));
        
        // Merge with existing notes, avoiding duplicates
        const merged = [...notes];
        for (const nn of newNotes) {
          const exists = merged.some(n => n.tick === nn.tick && n.lane === nn.lane);
          if (!exists) {
            merged.push(nn);
          }
        }
        setNotes(merged.sort((a, b) => a.tick - b.tick));
      };
      
      const deleteSelection = () => {
        if (selectionStart === null || selectionEnd === null) return;
        const start = Math.min(selectionStart, selectionEnd);
        const end = Math.max(selectionStart, selectionEnd);
        
        setNotes(notes.filter(n => n.tick < start || n.tick > end));
        clearSelection();
      };
      
      const nudgeSelection = (direction) => {
        if (selectionStart === null || selectionEnd === null) return;
        const start = Math.min(selectionStart, selectionEnd);
        const end = Math.max(selectionStart, selectionEnd);
        const nudgeAmount = direction * gridSnap;
        
        setNotes(notes.map(n => {
          if (n.tick >= start && n.tick <= end) {
            return { ...n, tick: n.tick + nudgeAmount };
          }
          return n;
        }).sort((a, b) => a.tick - b.tick));
        
        // Also move selection markers
        setSelectionStart(selectionStart + nudgeAmount);
        setSelectionEnd(selectionEnd + nudgeAmount);
      };
      
      const visibleNotes = notes.filter(n => {
        const noteStart = n.tick;
        const noteEnd = n.tick + (n.duration || 0);
        const viewStart = currentTick - ticksVisible/2;
        const viewEnd = currentTick + ticksVisible/2;
        // Note is visible if any part of it (including sustain) is in view
        return noteEnd >= viewStart && noteStart <= viewEnd;
      });
      
      const getNoteY = (tick) => 50 - ((tick - currentTick) / (ticksVisible / 2)) * 50;
      
      // Check if a tick is within selection
      const isInSelection = (tick) => {
        if (selectionStart === null || selectionEnd === null) return false;
        const start = Math.min(selectionStart, selectionEnd);
        const end = Math.max(selectionStart, selectionEnd);
        return tick >= start && tick <= end;
      };
      
      const exportChart = () => {
        const lines = [
          '[Song]', '{',
          `  Name = "${songName}"`,
          `  Artist = "${artistName}"`,
          `  Offset = ${-firstBeat.toFixed(3)}`,
          '  Resolution = 192',
          '  Player2 = bass',
          '  Difficulty = 0',
          '  PreviewStart = 0',
          '  PreviewEnd = 0',
          '  Genre = "rock"',
          '  MediaType = "cd"',
          `  MusicStream = "${audioFileName || 'song.mp3'}"`,
          '}',
          '[SyncTrack]', '{',
          '  0 = TS 4',
          ...tempoMap.map(t => `  ${t.tick} = B ${t.bpm * 1000}`),
          '}',
          '[Events]', '{', '}',
          '[ExpertSingle]', '{',
          ...notes.map(n => `  ${n.tick} = N ${n.lane} ${n.duration || 0}`),
          '}'
        ];
        
        const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${songName}.chart`;
        a.click();
        URL.revokeObjectURL(url);
        setShowMenu(false);
      };
      
      const formatTime = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
      
      // Resume screen
      if (screen === 'resume' && pendingLoadData) {
        return (
          <div className="h-full bg-gray-900 flex flex-col items-center justify-center p-6 text-white">
            <h1 className="text-2xl font-bold mb-2">Resume Session?</h1>
            <p className="text-gray-400 mb-1 text-center">Found saved progress for:</p>
            <p className="text-xl text-blue-400 mb-1">{pendingLoadData.songName}</p>
            <p className="text-sm text-gray-500 mb-4">
              {pendingLoadData.notes?.length || 0} notes • 
              Saved {new Date(pendingLoadData.savedAt).toLocaleDateString()}
            </p>
            
            <p className="text-gray-400 text-sm mb-2">Select the audio file to continue:</p>
            <p className="text-yellow-500 text-xs mb-4 text-center">
              ({pendingLoadData.audioFileName})
            </p>
            
            <label className="px-6 py-3 bg-blue-600 rounded-lg text-lg cursor-pointer active:bg-blue-700 mb-4">
              Select Audio File
              <input type="file" accept="audio/*" onChange={handleResumeAudio} className="hidden" />
            </label>
            
            <button onClick={startFresh} className="px-4 py-2 bg-gray-700 rounded text-sm">
              Start Fresh Instead
            </button>
          </div>
        );
      }
      
      // Upload screen
      if (screen === 'upload') {
        return (
          <div className="h-full bg-gray-900 flex flex-col items-center justify-center p-6 text-white">
            <h1 className="text-3xl font-bold mb-2">ChartMaker</h1>
            <p className="text-gray-400 mb-8 text-center">Auto tempo detection + mobile charting for Clone Hero</p>
            
            <label className="px-8 py-4 bg-blue-600 rounded-lg text-xl cursor-pointer active:bg-blue-700 mb-4">
              Select MP3
              <input type="file" accept="audio/*" onChange={handleFileSelect} className="hidden" />
            </label>
            
            <p className="text-gray-500 text-sm mb-6">Supports MP3, WAV, OGG</p>
            
            <div className="border-t border-gray-700 pt-6 w-full max-w-xs">
              <p className="text-gray-400 text-sm text-center mb-3">Or load saved progress:</p>
              <label className="block w-full px-4 py-2 bg-gray-700 rounded text-center cursor-pointer active:bg-gray-600">
                Load .chartmaker File
                <input type="file" accept=".chartmaker,.json" onChange={handleLoadProgress} className="hidden" />
              </label>
            </div>
          </div>
        );
      }
      
      // Analyzing screen
      if (screen === 'analyzing') {
        return (
          <div className="h-full bg-gray-900 flex flex-col items-center justify-center p-6 text-white">
            <h1 className="text-2xl font-bold mb-4">Analyzing...</h1>
            {analysisProgress && <p className="text-blue-400 mb-4">{analysisProgress}</p>}
            {analysisError ? (
              <div className="text-center">
                <p className="text-red-400 mb-4">{analysisError}</p>
                <button onClick={() => setScreen('upload')} className="px-6 py-2 bg-gray-700 rounded">
                  Try Again
                </button>
              </div>
            ) : (
              <div className="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin" />
            )}
          </div>
        );
      }
      
      // Chart screen
      return (
        <div className="flex flex-col h-full bg-gray-900 text-white select-none overflow-hidden">
          {audioUrl && (
            <audio
              ref={audioRef}
              src={audioUrl}
              onCanPlayThrough={handleCanPlayThrough}
              onEnded={() => setIsPlaying(false)}
              onPause={() => setIsPlaying(false)}
              onPlay={() => setIsPlaying(true)}
              onSeeked={() => {
                // Update our state when seek completes
                if (audioRef.current) {
                  setCurrentTime(audioRef.current.currentTime);
                }
              }}
              onTimeUpdate={() => {
                // Backup time sync when playing
                if (isPlaying && audioRef.current) {
                  setCurrentTime(audioRef.current.currentTime);
                }
              }}
              preload="auto"
              playsInline
            />
          )}
          
          {/* Main Menu Modal */}
          {showMenu && (
            <div className="modal-overlay" onClick={() => setShowMenu(false)}>
              <div className="bg-gray-800 rounded-lg p-4 m-4 w-full max-w-sm" onClick={e => e.stopPropagation()}>
                <h2 className="text-lg font-bold mb-4">Menu</h2>
                
                <button onClick={saveProgress} className="w-full px-4 py-3 bg-blue-600 rounded mb-2 text-left">
                  💾 Save Progress
                </button>
                
                <label className="block w-full px-4 py-3 bg-gray-700 rounded mb-2 cursor-pointer">
                  📂 Load Progress
                  <input type="file" accept=".chartmaker,.json" onChange={handleLoadProgress} className="hidden" />
                </label>
                
                <button onClick={exportChart} className="w-full px-4 py-3 bg-green-600 rounded mb-2 text-left">
                  📤 Export .chart
                </button>
                
                <div className="border-t border-gray-700 mt-4 pt-4">
                  <button onClick={() => { startFresh(); setShowMenu(false); }} className="w-full px-4 py-2 bg-red-900 rounded text-left text-sm">
                    🗑️ Discard & Start New
                  </button>
                </div>
                
                {lastSaved && (
                  <p className="text-xs text-gray-500 mt-4 text-center">
                    Auto-saved {lastSaved.toLocaleTimeString()}
                  </p>
                )}
                
                <button onClick={() => setShowMenu(false)} className="w-full px-4 py-2 bg-gray-600 rounded mt-4">
                  Close
                </button>
              </div>
            </div>
          )}
          
          {/* Edit Toolbar - slides down, no overlay */}
          {showEditMenu && (
            <div className="bg-gray-800 border-b border-gray-700 p-2 flex flex-col gap-2">
              <div className="flex items-center gap-2">
                <button onClick={setSelectionStartHere} className="px-2 py-1 bg-purple-700 rounded text-xs">
                  Start
                </button>
                <button onClick={setSelectionEndHere} className="px-2 py-1 bg-purple-700 rounded text-xs">
                  End
                </button>
                <span className="text-xs text-gray-400 flex-1 text-center">
                  {selectionStart !== null && selectionEnd !== null 
                    ? `Beat ${Math.floor(Math.min(selectionStart, selectionEnd)/RESOLUTION)}-${Math.floor(Math.max(selectionStart, selectionEnd)/RESOLUTION)}`
                    : 'No selection'}
                </span>
                <button onClick={clearSelection} className="px-2 py-1 bg-gray-700 rounded text-xs">
                  Clear
                </button>
                <button onClick={() => setShowEditMenu(false)} className="px-2 py-1 bg-gray-600 rounded text-xs">
                  ✕
                </button>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => nudgeSelection(-1)}
                  disabled={selectionStart === null || selectionEnd === null}
                  className="px-2 py-1 bg-gray-700 rounded text-xs disabled:opacity-30"
                >
                  ← Nudge
                </button>
                <button 
                  onClick={copySelection} 
                  disabled={selectionStart === null || selectionEnd === null}
                  className="px-2 py-1 bg-blue-600 rounded text-xs disabled:opacity-30"
                >
                  Copy
                </button>
                <button 
                  onClick={pasteAtCurrent}
                  disabled={clipboard.length === 0}
                  className="px-2 py-1 bg-green-600 rounded text-xs disabled:opacity-30"
                >
                  Paste{clipboard.length > 0 ? ` (${clipboard.length})` : ''}
                </button>
                <button 
                  onClick={deleteSelection}
                  disabled={selectionStart === null || selectionEnd === null}
                  className="px-2 py-1 bg-red-600 rounded text-xs disabled:opacity-30"
                >
                  Delete
                </button>
                <button 
                  onClick={() => nudgeSelection(1)}
                  disabled={selectionStart === null || selectionEnd === null}
                  className="px-2 py-1 bg-gray-700 rounded text-xs disabled:opacity-30"
                >
                  Nudge →
                </button>
              </div>
            </div>
          )}
          
          {/* Top controls */}
          <div className="bg-gray-800 p-2 flex flex-col gap-1.5 flex-shrink-0">
            {/* Row 1: Menu, song name, edit, export */}
            <div className="flex items-center gap-2">
              <button onClick={() => setShowMenu(true)} className="px-2 py-1 bg-gray-700 rounded text-sm">☰</button>
              <input
                type="text"
                value={songName}
                onChange={(e) => setSongName(e.target.value)}
                className="flex-1 bg-gray-700 text-white text-sm px-2 py-1 rounded truncate"
                placeholder="Song name"
              />
              <button onClick={() => setShowEditMenu(true)} className="px-2 py-1 bg-purple-600 rounded text-sm">✂️</button>
              <button onClick={exportChart} className="px-2 py-1 bg-green-600 rounded text-sm">Export</button>
            </div>
            
            {/* Row 2: Tempo and grid snap */}
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-400">Tempo:</span>
              {['section', 'measure', 'beat'].map(type => (
                <button
                  key={type}
                  onClick={() => handleTempoMapTypeChange(type)}
                  className={`px-1.5 py-0.5 rounded text-xs ${tempoMapType === type ? 'bg-blue-600' : 'bg-gray-700'}`}
                >
                  {type.slice(0,3)}
                </button>
              ))}
              <span className="text-xs text-gray-500">|</span>
              <span className="text-xs text-gray-400">Grid:</span>
              <button
                onClick={() => setGridSnap(RESOLUTION)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === RESOLUTION ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                1
              </button>
              <button
                onClick={() => setGridSnap(HALF_BEAT)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === HALF_BEAT ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                ½
              </button>
              <button
                onClick={() => setGridSnap(RESOLUTION/4)}
                className={`px-1.5 py-0.5 rounded text-xs ${gridSnap === RESOLUTION/4 ? 'bg-blue-600' : 'bg-gray-700'}`}
              >
                ¼
              </button>
              <button
                onClick={() => setReverseScroll(!reverseScroll)}
                className={`ml-auto px-1.5 py-0.5 rounded text-xs ${reverseScroll ? 'bg-yellow-600' : 'bg-gray-700'}`}
                title="Reverse scroll direction"
              >
                {reverseScroll ? '⇅' : '⇵'}
              </button>
            </div>
            
            {/* Row 3: Playback */}
            <div className="flex items-center gap-2">
              <button
                onClick={togglePlay}
                disabled={!audioReady}
                className={`w-10 h-8 rounded text-lg ${audioReady ? 'bg-green-600' : 'bg-gray-700 opacity-50'}`}
              >
                {isPlaying ? '⏸' : '▶'}
              </button>
              {[0.25, 0.5, 0.75, 1.0].map(rate => (
                <button
                  key={rate}
                  onClick={() => handleRateChange(rate)}
                  className={`px-2 py-1 rounded text-xs ${playbackRate === rate ? 'bg-blue-600' : 'bg-gray-700'}`}
                >
                  {rate === 1 ? '1x' : `${Math.round(rate*100)}%`}
                </button>
              ))}
              <span className="text-sm text-yellow-400 ml-auto">{currentBpm} BPM</span>
            </div>
            
            {/* Row 4: Time + progress */}
            <div className="flex items-center gap-2">
              <span className="font-mono text-sm w-10">{formatTime(currentTime)}</span>
              <div className="flex-1 h-2 bg-gray-700 rounded overflow-hidden relative">
                {/* Progress */}
                <div 
                  className="absolute top-0 bottom-0 left-0 bg-blue-500"
                  style={{ width: `${progressPercent}%` }}
                />
              </div>
              <span className="font-mono text-sm w-10 text-right">{formatTime(duration)}</span>
              <span className="text-xs text-gray-400">{progressPercent.toFixed(0)}%</span>
            </div>
            
            {/* Row 5: Navigation */}
            <div className="flex items-center justify-center gap-1">
              <button onClick={() => moveByBeats(-4)} className="px-2 py-1 bg-gray-700 rounded text-xs">-4</button>
              <button onClick={() => moveByBeats(-1)} className="px-2 py-1 bg-gray-700 rounded text-xs">-1</button>
              <button onClick={() => moveByGrid(-1)} className="px-2 py-1 bg-gray-600 rounded text-xs">◀</button>
              <span className="text-xs text-gray-400 w-16 text-center">Beat {Math.floor(currentTick / RESOLUTION)}</span>
              <button onClick={() => moveByGrid(1)} className="px-2 py-1 bg-gray-600 rounded text-xs">▶</button>
              <button onClick={() => moveByBeats(1)} className="px-2 py-1 bg-gray-700 rounded text-xs">+1</button>
              <button onClick={() => moveByBeats(4)} className="px-2 py-1 bg-gray-700 rounded text-xs">+4</button>
            </div>
          </div>
          
          {/* Highway */}
          <div 
            className="flex-1 flex relative overflow-hidden touch-none"
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
          >
            {/* Waveform - behind everything */}
            {waveformData && waveformData.length > 0 && (
              <div className="absolute inset-0 pointer-events-none z-0 flex items-center justify-center">
                {(() => {
                  // Use tick-based positioning to match the note grid
                  // Calculate time range for visible ticks
                  const startTick = currentTick - ticksVisible / 2;
                  const endTick = currentTick + ticksVisible / 2;
                  const startTime = tickToTime(Math.max(0, startTick));
                  const endTime = tickToTime(endTick);
                  
                  // Get samples in visible time range
                  const visible = waveformData.filter(w => w.time >= startTime - 0.5 && w.time <= endTime + 0.5);
                  
                  return visible.map((sample, i) => {
                    // Convert sample time to tick position
                    const sampleTick = timeToTick(sample.time);
                    // Use same positioning as notes
                    const yPercent = 50 - ((sampleTick - currentTick) / (ticksVisible / 2)) * 50;
                    
                    if (yPercent < -2 || yPercent > 102) return null;
                    
                    const width = Math.max(2, sample.value * 60); // Max 60% width
                    
                    return (
                      <div
                        key={`wf-${i}`}
                        className="absolute bg-cyan-500 opacity-20 rounded-sm"
                        style={{
                          top: `${yPercent}%`,
                          left: '50%',
                          transform: 'translate(-50%, -50%)',
                          width: `${width}%`,
                          height: '3px'
                        }}
                      />
                    );
                  });
                })()}
              </div>
            )}
            
            {/* Selection highlight */}
            {selectionStart !== null && selectionEnd !== null && (
              <div 
                className="absolute left-0 right-0 bg-purple-500 opacity-20 pointer-events-none z-5"
                style={{
                  top: `${getNoteY(Math.max(selectionStart, selectionEnd))}%`,
                  bottom: `${100 - getNoteY(Math.min(selectionStart, selectionEnd))}%`
                }}
              />
            )}
            
            {/* Grid lines */}
            <div className="absolute inset-0 pointer-events-none z-10">
              {Array.from({ length: beatsVisible * 4 + 1 }, (_, i) => {
                const offset = i - beatsVisible * 2;
                const tick = snapToGrid(currentTick) + (offset * gridSnap);
                const y = getNoteY(tick);
                const isBeat = tick % RESOLUTION === 0;
                const isMeasure = tick % (RESOLUTION * 4) === 0;
                if (y < -5 || y > 105) return null;
                return (
                  <div
                    key={i}
                    className={`absolute w-full ${
                      isMeasure ? 'border-t-2 border-gray-400' : 
                      isBeat ? 'border-t border-gray-500' : 
                      'border-t border-gray-700 border-dashed'
                    }`}
                    style={{ top: `${y}%` }}
                  />
                );
              })}
              <div className="absolute w-full h-1 bg-white" style={{ top: '50%', transform: 'translateY(-50%)', boxShadow: '0 0 10px rgba(255,255,255,0.8)' }} />
            </div>
            
            {/* Lanes */}
            {LANE_COLORS.map((color, idx) => (
              <div
                key={idx}
                className="flex-1 relative"
                style={{ backgroundColor: `${color}08`, borderRight: idx < 4 ? '1px solid #374151' : 'none' }}
              >
                {visibleNotes.filter(n => n.lane === idx).map(note => {
                  const noteY = getNoteY(note.tick);
                  const hasSustain = note.duration && note.duration > 0;
                  const sustainEndY = hasSustain ? getNoteY(note.tick + note.duration) : noteY;
                  
                  return (
                    <React.Fragment key={`${note.tick}-${note.lane}`}>
                      {/* Sustain tail */}
                      {hasSustain && (
                        <div
                          className="absolute left-1/2 w-3 rounded-sm"
                          style={{
                            backgroundColor: color,
                            opacity: 0.7,
                            top: `${Math.min(noteY, sustainEndY)}%`,
                            height: `${Math.abs(noteY - sustainEndY)}%`,
                            transform: 'translateX(-50%)',
                          }}
                        />
                      )}
                      {/* Note head */}
                      <div
                        className="absolute left-1/2 w-10 h-4 rounded-full"
                        style={{
                          backgroundColor: color,
                          top: `${noteY}%`,
                          transform: 'translate(-50%, -50%)',
                          boxShadow: `0 0 8px ${color}`,
                          border: isInSelection(note.tick) ? '2px solid white' : 'none'
                        }}
                      />
                      {/* Sustain end cap */}
                      {hasSustain && (
                        <div
                          className="absolute left-1/2 w-6 h-2 rounded-sm"
                          style={{
                            backgroundColor: color,
                            top: `${sustainEndY}%`,
                            transform: 'translate(-50%, -50%)',
                          }}
                        />
                      )}
                    </React.Fragment>
                  );
                })}
              </div>
            ))}
            
            {notes.length === 0 && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span className="text-gray-600 text-sm">Swipe to scroll • Tap lanes below</span>
              </div>
            )}
          </div>
          
          {/* Note count + selection info */}
          <div className="bg-gray-800 py-1 text-center flex-shrink-0 flex justify-center gap-4">
            <span className="text-xs text-gray-400">{notes.length} notes</span>
            {sustainMode && <span className="text-xs text-yellow-400">SUSTAIN: {LANE_LABELS[sustainMode.lane]}</span>}
            {clipboard.length > 0 && <span className="text-xs text-purple-400">📋 {clipboard.length}</span>}
            {lastSaved && <span className="text-xs text-gray-600">saved {lastSaved.toLocaleTimeString()}</span>}
          </div>
          
          {/* Lane buttons */}
          <div className="flex h-20 flex-shrink-0">
            {LANE_COLORS.map((color, idx) => (
              <div key={idx} className="flex-1 flex flex-col">
                {/* Main note button */}
                <button
                  className="flex-1 flex items-center justify-center text-2xl font-bold active:brightness-75"
                  style={{ backgroundColor: color, boxShadow: 'inset 0 -2px 4px rgba(0,0,0,0.3)' }}
                  onClick={() => toggleNoteAtCurrent(idx)}
                >
                  {LANE_LABELS[idx]}
                </button>
                {/* Sustain zone */}
                <button
                  className="h-5 flex items-center justify-center text-xs font-bold active:brightness-75"
                  style={{ 
                    backgroundColor: sustainMode?.lane === idx ? '#fff' : `${color}99`,
                    color: sustainMode?.lane === idx ? color : '#fff',
                    boxShadow: 'inset 0 2px 4px rgba(0,0,0,0.4)'
                  }}
                  onClick={() => toggleSustainMode(idx)}
                >
                  {sustainMode?.lane === idx ? '●' : '―'}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<ChartMaker />);
  </script>
</body>
</html>
